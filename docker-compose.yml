# Deploy production - dung khi server co lai SSH. Xem huong dan day du trong
# DEPLOY.md. Can 1 file `.env` o cung thu muc nay (dua theo `.env.example`)
# truoc khi chay `docker compose up -d`.
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: booking_platform
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot', "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - '5000'
    # De container goi duoc Postfix chay tren MAY HOST that (khong phai
    # container khac) qua SMTP_HOST=host.docker.internal - xem DEPLOY.md muc
    # "Postfix". Tren Linux can khai bao map nay ro, khong tu co san nhu
    # Docker Desktop (Mac/Windows).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - listing_images:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_SITE_URL: ${SITE_URL}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Doc-only o day - chi backend duoc ghi (xem service backend o tren).
      # nginx phuc vu thang file tu volume nay o /uploads/, khong qua Node -
      # xem nginx.conf.
      - listing_images:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  # Anh listing luu local (khong con Cloudinary, 21/8) - volume rieng, ton tai
  # doc lap voi container, khong mat khi build lai image luc deploy.
  listing_images:
