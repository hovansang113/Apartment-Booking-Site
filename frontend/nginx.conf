# Serve SPA tinh + proxy /api sang service "backend" trong cung docker
# compose network (ten service = ten host, Docker tu phan giai DNS noi bo).
#
# HTTPS: port 80 chi con lam 2 viec - phuc vu ACME challenge cho certbot renew
# sau nay (webroot mode, khong downtime) va redirect het sang https. Chung chi
# duoc lay LAN DAU bang certbot --standalone (xem DEPLOY.md) - phai co san
# truoc khi nginx khoi dong voi block 443 nay, neu khong nginx se loi config
# va khong chay duoc (thieu file ssl_certificate).
server {
    listen 80;
    server_name reservesmith.com www.reservesmith.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name reservesmith.com www.reservesmith.com;

    ssl_certificate /etc/letsencrypt/live/reservesmith.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reservesmith.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Mac dinh nginx chi cho request toi 1MB (client_max_body_size), nho hon
    # ca gioi han multer o backend (5MB/anh, upload.middleware.js) - anh that
    # >1MB se bi nginx tra 413 truoc khi kip toi backend. Nang len 25MB de du
    # cho toi 10 anh/lan (CreateListingPage step 4) ma khong mo qua rong.
    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt/sitemap.xml phuc vu dong tu backend (danh sach listing luon
    # dung thoi diem hien tai) - xem seo.controller.js. Exact match (=) nen
    # luon uu tien hon location / o duoi du khai bao truoc hay sau.
    location = /robots.txt {
        proxy_pass http://backend:5000/robots.txt;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:5000/sitemap.xml;
        proxy_set_header Host $host;
    }

    # SPA (react-router) - fallback moi route ve index.html, tru file tinh
    # that su ton tai (JS/CSS/hinh...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
